name: Build gateway ARMv7

on:
  push:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-armv7.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-armv7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Set up playback browser test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install --prefix tests --no-save --package-lock=false playwright@1.56.1
          tests/node_modules/.bin/playwright install --with-deps chrome
          mkdir -p "$RUNNER_TEMP/playback-mediamtx"
          gh release download v1.20.0 --repo bluenviron/mediamtx --pattern mediamtx_v1.20.0_linux_amd64.tar.gz --dir "$RUNNER_TEMP/playback-mediamtx"
          echo "952d5f7d31d1b448ab4da4509550594c511d42636db9d7bb175d377f4ede81df  $RUNNER_TEMP/playback-mediamtx/mediamtx_v1.20.0_linux_amd64.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/playback-mediamtx/mediamtx_v1.20.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP/playback-mediamtx" mediamtx

      - name: Test real recording playback in desktop and mobile browsers
        env:
          PLAYBACK_TEST_MEDIAMTX: ${{ runner.temp }}/playback-mediamtx/mediamtx
        run: go test -race ./internal/gateway -run '^TestRecordingBrowser$' -count=1 -v -timeout 5m

      - name: Build Linux ARMv7 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -trimpath -ldflags="-s -w" -o lens-gateway-armv7 ./cmd/lens-gateway

      - name: Package and checksum
        run: |
          chmod 0755 lens-gateway-armv7
          sha256sum lens-gateway-armv7 > lens-gateway-armv7.sha256
          tar -czf lens-gateway-armv7.tar.gz lens-gateway-armv7

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            lens-gateway-armv7 \
            lens-gateway-armv7.tar.gz \
            lens-gateway-armv7.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ARMv7 build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated ARMv7 build from commit ${GITHUB_SHA}." \
            --prerelease
